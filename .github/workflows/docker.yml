name: Teste do Docker

on: [push, pull_request]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir a API
        run: docker compose up -d --build

      - name: Esperar a API iniciar
        run: sleep 10

      - name: Testar a API
        run: curl --fail http://localhost:3000/usuarios

      - name: Mostrar logs se falhar
        if: failure()
        run: docker compose logs